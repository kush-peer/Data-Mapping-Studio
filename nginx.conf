events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:8000;
  }

  upstream frontend {
    server frontend:3000;
  }

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # Gzip compression
  gzip on;
  gzip_types text/plain text/css text/javascript application/json application/javascript;
  gzip_min_length 1024;

  # Main server block
  server {
    listen 80 default_server;
    server_name _;

    # Increase request size limit for file uploads
    client_max_body_size 100M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API endpoints
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    # API health check
    location /health {
      proxy_pass http://backend;
      access_log off;
    }

    # API documentation
    location /docs {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # Frontend assets
    location ~ ^/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      limit_req zone=general_limit burst=50 nodelay;

      proxy_pass http://frontend;
      proxy_cache_valid 30d;
      add_header Cache-Control "public, immutable";
    }

    # Frontend app
    location / {
      limit_req zone=general_limit burst=30 nodelay;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SPA fallback: return index.html for non-existent files
      error_page 404 =200 /index.html;
    }
  }

  # HTTPS server (uncomment and configure with SSL certificates)
  # server {
  #   listen 443 ssl default_server;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate /etc/nginx/ssl/yourdomain.com.crt;
  #   ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #
  #   # Redirect HTTP to HTTPS
  #   error_page 497 =301 https://$host:$server_port$request_uri;
  #
  #   # ... rest of configuration same as above ...
  # }

  # Redirect HTTP to HTTPS (uncomment when SSL is configured)
  # server {
  #   listen 80;
  #   server_name yourdomain.com;
  #   return 301 https://$server_name$request_uri;
  # }
}
